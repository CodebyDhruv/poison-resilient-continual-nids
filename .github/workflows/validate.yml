name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required documentation
        run: |
          test -f README.md
          test -f docs/PROJECT_BLUEPRINT.md
          test -f docs/TEAM_WORKFLOW.md
          test -f .gitignore
